<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin | Mrou Topstudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <nav class="navbar admin-nav">
    <div class="logo">
      <span class="logo-icon">🔒</span> ESPACE ADMINISTRATION
    </div>
    <a href="/" class="btn-frontend">← Retour au site</a>
  </nav>

  <main class="main-container">

    <!-- Screen 1: Password Login Screen -->
    <div id="loginScreen" class="card" style="max-width: 450px; margin: 40px auto;">
      <h3>🔑 Accès Sécurisé Admin</h3>
      <p class="subtitle">Veuillez entrer le mot de passe administrateur :</p>
      
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="adminPasswordInput" placeholder="Entrez votre mot de passe">
      </div>
      <button onclick="loginAdmin()" class="btn-submit">Se Connecter</button>
      <p id="loginStatus" class="status-box"></p>
    </div>

    <!-- Screen 2: Dashboard UI (Hidden until authenticated) -->
    <div id="adminContent" class="admin-grid" style="display: none;">
      <div class="card upload-card">
        <h3>➕ Ajouter une chanson</h3>
        <p class="subtitle">Uploadez vos fichiers audio MP3</p>
        
        <form id="uploadForm">
          <div class="form-group">
            <label>Titre de la chanson</label>
            <input type="text" id="title" placeholder="Titre du morceau" required>
          </div>

          <div class="form-group">
            <label>Artiste / Compositeur</label>
            <input type="text" id="artist" placeholder="Nom de l'artiste" required>
          </div>

          <div class="form-group">
            <label>Catégorie</label>
            <select id="category">
              <option value="Hausa Hip-Hop">Hip-Hop</option>
              <option value="Afrobeats">Afrobeats</option>
              <option value="Studio Mix">Studio Mix</option>
              <option value="Gospel / Slow">Gospel / Slow</option>
            </select>
          </div>

          <div class="form-group">
            <label>Sélectionnez le fichier audio (MP3)</label>
            <input type="file" id="file" accept="audio/*" required>
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">Publier la chanson</button>
        </form>
        
        <div id="status" class="status-box"></div>
      </div>

      <div class="card preview-card">
        <h3>📊 Morceaux enregistrés</h3>
        <div id="adminSongList" class="admin-song-list"></div>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
