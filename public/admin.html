<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord Admin | Mrou Topstudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <nav class="navbar admin-nav">
    <div class="logo">
      <span class="logo-icon">⚡</span> PANNEAU D'ADMINISTRATION
    </div>
    <a href="/" class="btn-frontend">← Retour à l'accueil</a>
  </nav>

  <main class="main-container">
    <div class="admin-grid">
      
      <!-- Formulaire d'upload -->
      <div class="card upload-card">
        <h3>➕ Ajouter une nouvelle chanson</h3>
        <p class="subtitle">Entrez les détails et téléchargez le fichier audio MP3</p>
        
        <form id="uploadForm">
          <div class="form-group">
            <label>Titre de la chanson</label>
            <input type="text" id="title" placeholder="Ex: Bienvenue" required>
          </div>

          <div class="form-group">
            <label>Artiste / Compositeur</label>
            <input type="text" id="artist" placeholder="Ex: Mrou Topstudio" required>
          </div>

          <div class="form-group">
            <label>Catégorie</label>
            <select id="category">
              <option value="Hausa Hip-Hop">Hausa Hip-Hop</option>
              <option value="Afrobeats">Afrobeats</option>
              <option value="Studio Mix">Studio Mix</option>
              <option value="Gospel / Doux">Gospel / Doux</option>
            </select>
          </div>

          <div class="form-group">
            <label>Sélectionnez le fichier audio (MP3)</label>
            <input type="file" id="file" accept="audio/*" required>
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">Publier la chanson</button>
        </form>
        
        <div id="status" class="status-box"></div>
      </div>

      <!-- Preview Area -->
      <div class="card preview-card">
        <h3>📊 Chansons en ligne</h3>
        <div id="adminSongList" class="admin-song-list">
          <!-- Liste des chansons -->
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
